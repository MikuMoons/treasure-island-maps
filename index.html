<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Island Maps</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #1a2a3a 0%, #2d3e50 50%, #1a3a4a 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            color: #e0e0e0;
        }

        /* Falling leaves animation - subtle */
        .leaves-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .leaf {
            position: absolute;
            width: 40px;
            height: 40px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: fall linear infinite;
            opacity: 0.65;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
        }

        @keyframes fall {
            0% {
                opacity: 0;
            }
            15% {
                opacity: 0.65;
            }
            85% {
                opacity: 0.65;
            }
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .leaf:nth-child(1) { animation-duration: 8s; left: 10%; animation-delay: 0s; }
        .leaf:nth-child(2) { animation-duration: 10s; left: 20%; animation-delay: 2s; }
        .leaf:nth-child(3) { animation-duration: 12s; left: 30%; animation-delay: 4s; }
        .leaf:nth-child(4) { animation-duration: 9s; left: 40%; animation-delay: 1s; }
        .leaf:nth-child(5) { animation-duration: 11s; left: 50%; animation-delay: 3s; }
        .leaf:nth-child(6) { animation-duration: 10s; left: 60%; animation-delay: 5s; }
        .leaf:nth-child(7) { animation-duration: 9s; left: 70%; animation-delay: 2s; }
        .leaf:nth-child(8) { animation-duration: 12s; left: 80%; animation-delay: 4s; }
        .leaf:nth-child(9) { animation-duration: 11s; left: 90%; animation-delay: 1s; }
        .leaf:nth-child(10) { animation-duration: 10s; left: 5%; animation-delay: 3s; }

        /* Content */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        /* Minecraft server side ad */
        .mc-ad {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 220px;
            background: rgba(20, 32, 44, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 20px;
            z-index: 50;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .mc-ad img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 14px;
            display: block;
        }

        .mc-ad-text {
            color: #e0e0e0;
            font-size: 0.92em;
            line-height: 1.45;
            margin-bottom: 16px;
        }

        .mc-ad-text strong {
            color: #f5d76e;
        }

        .mc-join-btn {
            display: block;
            padding: 12px;
            background: linear-gradient(135deg, #5865F2 0%, #4752c4 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95em;
            letter-spacing: 0.4px;
            transition: all 0.3s ease;
        }

        .mc-join-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #4752c4 0%, #3c45a5 100%);
            box-shadow: 0 6px 18px rgba(88, 101, 242, 0.4);
        }

        /* Hide side ad on narrower screens, show inline version instead */
        .mc-ad-inline {
            display: none;
        }

        @media (max-width: 1250px) {
            aside.mc-ad:not(.mc-ad-inline) {
                display: none;
            }
            .mc-ad-inline {
                display: block;
                position: static;
                transform: none;
                width: 100%;
                max-width: 420px;
                margin: 0 auto 40px;
                right: auto;
                top: auto;
            }
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            background: rgba(255, 255, 255, 0.05);
            padding: 50px 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4em;
            color: #f5d76e;
            text-shadow: none;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1.15em;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Search */
        .search-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 13px 20px;
            font-size: 1em;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: #8a9aa8;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(245, 215, 110, 0.5);
            background: rgba(255, 255, 255, 0.09);
        }

        .no-results {
            display: none;
            text-align: center;
            color: #8a9aa8;
            font-size: 1.1em;
            margin: 40px 0;
        }

        /* Buttons */
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 24px;
            font-size: 0.95em;
            border: 1.5px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.3px;
        }

        .btn-all {
            border-color: #f5d76e;
            color: #f5d76e;
        }

        .btn-subscriber {
            border-color: #ff8a80;
            color: #ff8a80;
        }

        .btn-ffa {
            border-color: #80deea;
            color: #80deea;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        button.active {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(245, 215, 110, 0.3);
        }

        button.active.btn-subscriber {
            box-shadow: 0 0 20px rgba(255, 138, 128, 0.3);
        }

        button.active.btn-ffa {
            box-shadow: 0 0 20px rgba(128, 222, 234, 0.3);
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 30px;
        }

        .map-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            display: none;
            backdrop-filter: blur(5px);
        }

        .map-card.show {
            display: block;
        }

        .map-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .map-image {
            width: 100%;
            height: 440px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px;
        }

        .map-info {
            padding: 16px;
            text-align: center;
        }

        .map-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #f0f0f0;
            margin-bottom: 10px;
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }

        .map-type {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-subscriber {
            background: rgba(255, 138, 128, 0.15);
            color: #ff8a80;
            border: 1px solid rgba(255, 138, 128, 0.3);
        }

        .type-ffa {
            background: rgba(128, 222, 234, 0.15);
            color: #80deea;
            border: 1px solid rgba(128, 222, 234, 0.3);
        }

        .map-card a {
            display: inline-block;
            margin-top: 12px;
            color: #f5d76e;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.3s;
            padding: 6px 12px;
            border-bottom: 2px solid rgba(245, 215, 110, 0.3);
        }

        .map-card a:hover {
            color: #ffeaa7;
            border-bottom-color: #f5d76e;
        }

        /* Individual map page */
        .map-detail {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .map-detail.show {
            display: flex;
        }

        .map-detail-content {
            background: rgba(26, 42, 58, 0.95);
            border-radius: 10px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 138, 128, 0.2);
            color: #ff8a80;
            border: 1px solid rgba(255, 138, 128, 0.4);
            width: 40px;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 138, 128, 0.3);
            border-color: rgba(255, 138, 128, 0.6);
        }

        .detail-image {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            background: rgba(0, 0, 0, 0.3);
        }

        .detail-info {
            padding: 35px;
            text-align: center;
        }

        .detail-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            font-weight: 700;
            color: #f5d76e;
            text-transform: capitalize;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .detail-type {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.95em;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-link {
            margin-top: 25px;
        }

        .copy-link input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            font-size: 0.95em;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            font-family: 'Outfit', monospace;
        }

        .copy-link input:focus {
            outline: none;
            border-color: rgba(245, 215, 110, 0.5);
        }

        .copy-btn {
            background: rgba(245, 215, 110, 0.15);
            color: #f5d76e;
            padding: 11px 22px;
            border: 1px solid rgba(245, 215, 110, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.3px;
        }

        .copy-btn:hover {
            background: rgba(245, 215, 110, 0.25);
            border-color: rgba(245, 215, 110, 0.6);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .subtitle {
                font-size: 1em;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .map-image {
                height: 340px;
            }

            .map-detail-content {
                max-width: 95%;
                max-height: 95vh;
            }

            .detail-name {
                font-size: 1.6em;
            }

            .detail-info {
                padding: 20px;
            }
        }

        /* Twitch link */
        .twitch-link {
            margin-bottom: 15px;
        }

        .twitch-link a {
            color: #f5d76e;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            letter-spacing: 0.3px;
            transition: all 0.3s;
            border-bottom: 2px solid rgba(245, 215, 110, 0.3);
            padding-bottom: 2px;
        }

        .twitch-link a:hover {
            color: #ffeaa7;
            border-bottom-color: #f5d76e;
        }

        /* LIVE button */
        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 5px rgba(76, 175, 80, 0.6), 0 0 15px rgba(76, 175, 80, 0.4);
            }
            50% {
                box-shadow: 0 0 15px rgba(76, 175, 80, 1), 0 0 30px rgba(76, 175, 80, 0.6);
            }
            100% {
                box-shadow: 0 0 5px rgba(76, 175, 80, 0.6), 0 0 15px rgba(76, 175, 80, 0.4);
            }
        }

        .live-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 30px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1em;
            letter-spacing: 0.5px;
            animation: pulse-glow 1.5s ease-in-out infinite;
            border: 2px solid #4CAF50;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .live-button:before {
            content: '';
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        .live-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #45a049 0%, #3d8b40 100%);
        }
    </style>
</head>
<body>
    <!-- Falling leaves -->
    <div class="leaves-container" id="leavesContainer"></div>

    <!-- Minecraft server side ad (desktop) -->
    <aside class="mc-ad">
        <img src="images/EdenSMP2.png" alt="EdenSMP Minecraft Network">
        <p class="mc-ad-text">Like our islands? You'll enjoy our <strong>Minecraft network!</strong> Join us!</p>
        <a href="https://discord.gg/J9HA2d93pq" target="_blank" class="mc-join-btn">Join</a>
    </aside>

    <!-- Main content -->
    <div class="container">
        <header>
            <h1>Treasure Island Maps</h1>
            <p class="subtitle">Browse all available islands to visit</p>
            <div>
                <p class="twitch-link"><a href="https://www.twitch.tv/treasureislands/" target="_blank">twitch.tv/treasureislands</a></p>
                <a href="https://www.twitch.tv/treasureislands/" target="_blank" class="live-button">LIVE NOW</a>
            </div>
        </header>

        <!-- Minecraft server ad (inline, shown on smaller screens) -->
        <aside class="mc-ad-inline mc-ad">
            <img src="images/EdenSMP2.png" alt="EdenSMP Minecraft Network">
            <p class="mc-ad-text">Like our islands? You'll enjoy our <strong>Minecraft network!</strong> Join us!</p>
            <a href="https://discord.gg/J9HA2d93pq" target="_blank" class="mc-join-btn">Join</a>
        </aside>

        <div class="search-wrap">
            <input type="text" id="searchInput" class="search-input" placeholder="Search maps..." oninput="applyFilters()">
        </div>

        <div class="filter-buttons">
            <button class="btn-all active" onclick="filterMaps('all')">All</button>
            <button class="btn-subscriber" onclick="filterMaps('subscriber')">Subscriber Only</button>
            <button class="btn-ffa" onclick="filterMaps('ffa')">FFA</button>
        </div>

        <div class="no-results" id="noResults">No maps match your search.</div>

        <div class="gallery" id="gallery"></div>
    </div>

    <!-- Map detail modal -->
    <div class="map-detail" id="mapDetail">
        <div class="map-detail-content">
            <button class="close-btn" onclick="closeMapDetail()">✕</button>
            <img id="detailImage" class="detail-image" alt="">
            <div class="detail-info">
                <div class="detail-name" id="detailName"></div>
                <div class="detail-type" id="detailType"></div>
                <div class="copy-link">
                    <input type="text" id="mapLink" readonly>
                    <button class="copy-btn" onclick="copyLink()">Copy Link</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Map data — name (display) + file (exact filename in images folder)
        const subscriberMaps = [
            { name: 'cactus', file: 'Cactus.png' },
            { name: 'mocha', file: 'MOCHA.png' },
            { name: 'tulip', file: 'TULIP.png' },
            { name: 'reef', file: 'REEF.png' },
            { name: 'honey', file: 'HONEY.png' },
            { name: 'dusk', file: 'DUSK.png' },
            { name: 'bloom', file: 'BLOOM.png' },
            { name: 'shore', file: 'SHORE.png' },
            { name: 'pixie', file: 'PIXIE.png' },
            { name: 'diy', file: 'DIY.png' },
            { name: 'breeze', file: 'BREEZE.png' },
            { name: 'core', file: 'CORE.png' },
            { name: 'core2', file: 'CORE2.png' },
            { name: 'sunset', file: 'SUNSET.png' },
            { name: 'attire', file: 'ATTIRE.png' },
            { name: 'costume', file: 'COSTUME.png' },
            { name: 'mono', file: 'MONO.png' },
            { name: 'bumble', file: 'BUMBLE.png' },
            { name: 'indigo', file: 'INDIGO.png' },
            { name: 'cherry', file: 'CHERRY.png' },
            { name: 'eden', file: 'EDEN.png' }
        ];

        const ffaMaps = [
            { name: 'fern', file: 'FERN.png' },
            { name: 'latte', file: 'LATTE.png' },
            { name: 'orchid', file: 'ORCHID.png' },
            { name: 'coral', file: 'CORAL.png' },
            { name: 'syrup', file: 'SYRUP.png' },
            { name: 'dawn', file: 'DAWN.png' },
            { name: 'petal', file: 'PETAL.png' },
            { name: 'bay', file: 'BAY.png' },
            { name: 'atlas', file: 'ATLAS.png' },
            { name: 'school', file: 'school.png' },
            { name: 'wither', file: 'WITHER.webp' },
            { name: 'cloud', file: 'CLOUD.webp' },
            { name: 'nookea', file: 'nookea.png' },
            { name: 'series', file: 'SERIES.webp' },
            { name: 'tutor', file: 'tutor.png' },
            { name: 'repair', file: 'repair.png' },
            { name: 'snug', file: 'snug.png' },
            { name: 'garment', file: 'GARMENT.webp' },
            { name: 'robe', file: 'ROBE.webp' },
            { name: 'suit', file: 'SUIT.webp' },
            { name: 'wardrobe', file: 'WARDROBE.webp' },
            { name: 'oasis', file: 'oasis.png' },
            { name: 'atoll', file: 'ATOLL.png' },
            { name: 'haru', file: 'HARU.png' },
            { name: 'natsu', file: 'natsu.png' },
            { name: 'aki', file: 'aki.png' },
            { name: 'fuyu', file: 'fuyu.png' }
        ];

        const allMaps = [
            ...subscriberMaps.map(m => ({ name: m.name, file: m.file, type: 'subscriber' })),
            ...ffaMaps.map(m => ({ name: m.name, file: m.file, type: 'ffa' }))
        ];

        // Quick lookup: name -> filename (for the detail modal)
        const fileByName = {};
        allMaps.forEach(m => { fileByName[m.name] = m.file; });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createLeaves();
            renderGallery();
        });

        function createLeaves() {
            const container = document.getElementById('leavesContainer');
            const leafColors = ['#ff6b35', '#f7931e', '#e0902a', '#cd5c5c', '#c0392b', '#d4a373', '#b5651d'];

            // A simple maple-ish leaf as an SVG path
            const leafSVG = (color) => `data:image/svg+xml;utf8,` + encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color}">
                    <path d="M12 2c1 2 2 3 4 3-1 1-1 2-1 3 2-1 3-1 5-1-1 2-2 3-2 4 1 0 2 1 3 1-2 2-4 3-6 3l1 4h-2l-1-4c-2 0-4-1-6-3 1 0 2-1 3-1 0-1-1-2-2-4 2 0 3 0 5 1 0-1 0-2-1-3 2 0 3-1 4-3z"/>
                </svg>`
            );

            for (let i = 0; i < 18; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                const color = leafColors[i % leafColors.length];
                leaf.style.backgroundImage = `url("${leafSVG(color)}")`;
                leaf.style.left = (Math.random() * 100) + '%';
                leaf.style.top = (Math.random() * -200) + 'px';
                const size = 26 + Math.random() * 24;
                leaf.style.width = size + 'px';
                leaf.style.height = size + 'px';
                leaf.style.animationDuration = (7 + Math.random() * 7) + 's';
                leaf.style.animationDelay = (Math.random() * 6) + 's';
                container.appendChild(leaf);
            }
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            allMaps.forEach((map, index) => {
                const card = document.createElement('div');
                card.className = `map-card show ${map.type}`;
                card.dataset.name = map.name.toLowerCase();
                card.dataset.type = map.type;
                card.innerHTML = `
                    <img src="images/${map.file}" alt="${map.name}" class="map-image">
                    <div class="map-info">
                        <div class="map-name">${map.name}</div>
                        <span class="map-type ${map.type === 'subscriber' ? 'type-subscriber' : 'type-ffa'}">
                            ${map.type === 'subscriber' ? 'Subscriber' : 'FFA'}
                        </span>
                        <a href="#" onclick="openMapDetail(event, '${map.name}', '${map.type}')">View</a>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // Current active category, combined with search text
        let activeType = 'all';

        function filterMaps(type) {
            activeType = type;
            // Update button states
            document.querySelectorAll('.filter-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            if (event && event.target) event.target.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            const cards = document.querySelectorAll('.map-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const matchesType = (activeType === 'all') || (card.dataset.type === activeType);
                const matchesSearch = (query === '') || card.dataset.name.includes(query);
                if (matchesType && matchesSearch) {
                    card.classList.add('show');
                    visibleCount++;
                } else {
                    card.classList.remove('show');
                }
            });

            document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
        }

        function openMapDetail(e, mapName, mapType) {
            e.preventDefault();
            const modal = document.getElementById('mapDetail');
            const image = document.getElementById('detailImage');
            const nameEl = document.getElementById('detailName');
            const typeEl = document.getElementById('detailType');
            const linkInput = document.getElementById('mapLink');

            // Use exact filename
            image.src = `images/${fileByName[mapName]}`;

            nameEl.textContent = mapName;
            typeEl.textContent = mapType.toUpperCase();
            typeEl.className = `detail-type ${mapType === 'subscriber' ? 'type-subscriber' : 'type-ffa'}`;
            
            // Generate shareable link
            const mapId = `${mapName}-${mapType}`;
            linkInput.value = `${window.location.origin}?map=${encodeURIComponent(mapId)}`;

            modal.classList.add('show');
        }

        function closeMapDetail() {
            document.getElementById('mapDetail').classList.remove('show');
        }

        function copyLink() {
            const input = document.getElementById('mapLink');
            input.select();
            document.execCommand('copy');
            
            const btn = document.querySelector('.copy-btn');
            const original = btn.textContent;
            btn.textContent = 'Copied';
            setTimeout(() => {
                btn.textContent = original;
            }, 2000);
        }

        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
        }

        // Close modal when clicking outside
        document.getElementById('mapDetail').addEventListener('click', (e) => {
            if (e.target.id === 'mapDetail') closeMapDetail();
        });
    </script>
</body>
</html>
